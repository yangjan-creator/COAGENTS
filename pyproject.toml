[project]
name = "coagents"
version = "0.2.0"
description = "API-first project control for human and agent teams"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.0",
  "uvicorn[standard]==0.41.0",
  "sqlalchemy==2.0.48",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.13.1",
  "httpx==0.28.1",
  "mcp==1.23.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
coagents-mcp = "apc.mcp.server:main"
coagents-demo = "apc.demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apc = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
