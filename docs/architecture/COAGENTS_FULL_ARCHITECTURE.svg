<rect x="40" y="950" width="1340" height="44" rx="8" fill="#e9eef5"/><text x="58" y="976" font-size="13">部署／還原是獨立控制面：只認已驗release＋具名operator；備份副本不啟動外送；長期觀察未滿不結案。</text>
<text x="40" y="1160" font-size="13">關鍵流：1–2 command→API；3–5 身分/授權→Domain；6 atomic SQL；7 commit後outbox；8 scheduler；9–12 delivery＋出站重驗。</text>
<text x="40" y="1185" font-size="13">13–16 records/artifacts/Git進同一Domain；17 guarded migration；18真人接入；19–23部署/備份/還原/觀察。</text>
<text x="40" y="1210" font-size="12">精確欄位與箭頭label見同目錄 .mmd 原始碼；排程、通知、Webhook、SSO、GitSync尚未接通，不因畫出而視為完成。</text>
</g></svg>
