<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1240" viewBox="0 0 1440 1240" role="img" aria-labelledby="title desc">
<title id="title">COAGENTS 完整目標架構與當次實作狀態</title>
<desc id="desc">作者滴。十九元件含Dashboard、MCP、身分、授權、Domain tx、outbox、scheduler、notifier、webhook、SSO、GitSync、DB、部署及還原；標註B/R/X需求。綠為基線，黃為限定DEV或待審，灰為未實作。箭頭代表資料、權限和操作流；未部署節點不是完成。</desc>
